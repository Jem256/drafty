# Role -> model mapping for Drafty.
# OWNER: replace the REPLACE_ME values with the exact IDs from `uv run python scripts/list_models.py`
# (GET https://api.tokenfactory.nebius.com/v1/models). Only NVIDIA Nemotron models are allowed.

provider:
  base_url: https://api.tokenfactory.nebius.com/v1/
  api_key_env: NEBIUS_API_KEY

models:
  ultra: REPLACE_ME_nemotron_3_ultra_id
  super: REPLACE_ME_nemotron_3_super_id
  nano: REPLACE_ME_nemotron_3_nano_id

# Capability flags per model, confirmed by the Phase 1 live tests.
# json_mode: false -> llm.py falls back to "return only JSON" prompting plus validation and retry.
capabilities:
  ultra: {json_mode: true, tool_calling: true}
  super: {json_mode: true, tool_calling: true}
  nano:  {json_mode: true, tool_calling: true}

# Which model each call role uses, per setup. The app uses `routed`; the eval runner compares all three.
setups:
  routed:
    route: nano
    parse: ultra
    clarify: nano
    draft: super
    draft_fallback: ultra
    revise: ultra
    explain: super
    label: nano
  all_ultra:
    route: ultra
    parse: ultra
    clarify: ultra
    draft: ultra
    draft_fallback: ultra
    revise: ultra
    explain: ultra
    label: ultra
  all_super:
    route: super
    parse: super
    clarify: super
    draft: super
    draft_fallback: super
    revise: super
    explain: super
    label: super

# Per-role generation settings (starting values; tune with evals).
roles:
  route:   {temperature: 0.0, max_tokens: 64}
  parse:   {temperature: 0.1, max_tokens: 4096}
  clarify: {temperature: 0.3, max_tokens: 400}
  draft:   {temperature: 0.2, max_tokens: 2048}
  revise:  {temperature: 0.2, max_tokens: 2048}
  explain: {temperature: 0.3, max_tokens: 800}
  label:   {temperature: 0.2, max_tokens: 200}

limits:
  parse_retries: 2
  invalid_drafts_before_cascade: 2
  revision_cap: 5
