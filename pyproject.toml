[project]
name = "drafty"
version = "0.0.1"
description = "Turn a plain-language road brief into a checked first-draft drainage design."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Jemimah" }]
dependencies = [
    "pydantic>=2.7",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "openai>=1.30",
    "tenacity>=8.3",
    "pyyaml>=6.0",
    "ezdxf>=1.3",
    "matplotlib>=3.8",
    "networkx>=3.3",
    "boto3>=1.34",
    "sse-starlette>=2.1",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drafty"]

[tool.pytest.ini_options]
addopts = "-m 'not live'"
markers = [
    "live: tests that call the Nebius Token Factory API (require NEBIUS_API_KEY)",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["drafty", "specs"]

[tool.ruff.format]
quote-style = "double"
